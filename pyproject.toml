[project]
name = "fly-in"
version = "1.0.0"
description = "A multi-agent drone routing simulation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
    "rich>=15.0.0",
]

requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    '^\.venv/',
    '^build/',
    '^dist/',
]
